<div class="editor-kecil">
    <h2>Pengkonversi Gaya Teks</h2>
    <p>Alat ini bisa mengubah teks menjadi huruf besar, huruf kecil, dan paragraf.</p>
    
    <label>Masukkan teks:</label>
    <textarea id="text-input" placeholder="write, test, and fix code quickly with github copilot"></textarea>
    
    <div class="info-hitungan">
        Huruf: 0, huruf besar: 0 huruf kecil: 0
    </div>

    <div class="tombol-aksi">
        <button id="besar">Besarkan</button>
        <button id="kecil">Kecilkan</button>
    </div>

    <div id="mode-div">
        <button id="light" onclick="changeMode('light')">Mode Terang</button>
        <button id="dark" onclick="changeMode('dark')">Mode Gelap</button>
    </div>
</div>
